name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Containerfile
      - compose.yaml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - flake.nix
      - flake.lock

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - pbsmcp-server
          - pgmcp-server
          - prommcp-server
          - lokimcp-server
          - hamcp-server
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          podman build --build-arg BIN=${{ matrix.server }} \
            -t ${{ matrix.server }}:${{ github.sha }} \
            -f Containerfile .
      - name: Verify binary in image
        run: |
          podman run --rm ${{ matrix.server }}:${{ github.sha }} --healthcheck || true

  # Push to Harbor registry on semver tags (e.g. 0.2.5, v0.2.5).
  # Requires HARBOR_USERNAME and HARBOR_PASSWORD secrets.
  push:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        server:
          - pbsmcp-server
          - pgmcp-server
          - prommcp-server
          - lokimcp-server
          - hamcp-server
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Harbor
        uses: redhat-actions/podman-login@v1
        with:
          registry: homelab-harbor.dropbear-butterfly.ts.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="${VERSION#refs/tags/}"
          podman build --build-arg BIN=${{ matrix.server }} \
            -t homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${{ matrix.server }}:${VERSION} \
            -t homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${{ matrix.server }}:latest \
            -f Containerfile .
          podman push homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${{ matrix.server }}:${VERSION}
          podman push homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${{ matrix.server }}:latest
