# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/main/pipeline/frontend/yaml/linter/schema/schema.json
#
# Build and push one image per server binary to the homelab Harbor registry.
# The CI equivalent of ./push_harbor.sh.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP REQUIRED -- this workflow cannot run until all three are done:
#
#   1. Repo secrets (Woodpecker -> repo -> Settings -> Secrets), both scoped to
#      the `tag` event ONLY (never pull_request):
#        HARBOR_USERNAME   Harbor robot account name
#        HARBOR_PASSWORD   Harbor robot account token
#
#   2. Repo -> Settings -> Trusted -> **Security** enabled by a server admin.
#      Trust is granular (Network / Volumes / Security are separate toggles);
#      `privileged` needs Security ONLY -- this workflow mounts no volumes and
#      touches no network settings, so leave the other two off.
#
#   3. Server admin sets, with the tag pinned exactly as written below:
#        WOODPECKER_PLUGINS_PRIVILEGED=woodpeckerci/plugin-docker-buildx:5
#      Since Woodpecker 3.0 no plugin gets privileged by default.
#
# (2) and (3) are DIFFERENT gates and fail at different times:
#   * (2) is checked by the linter when the pipeline is created. The linter
#     validates every workflow file regardless of its `when:` conditions, so
#     while Security is off this file blocks test.yaml and preflight.yaml from
#     running too -- on pushes that would never build an image at all.
#   * (3) is enforced at runtime, so it only surfaces when a tag is actually
#     pushed. Its error reads like a YAML mistake but is not.
#
# Why buildx and not kaniko: kaniko needs neither (2) nor (3), which would make
# it the obvious choice -- but it does not implement BuildKit's
# `RUN --mount=type=cache`, which Containerfile relies on. Kaniko upstream was
# also archived in June 2025. Note the cache mounts are daemon-local and so buy
# nothing in CI; they matter for local `just image-all`, which is the real cost
# of switching. To drop the privileged requirement: delete the cache mounts from
# Containerfile and switch this to woodpeckerci/plugin-kaniko.
# ---------------------------------------------------------------------------

# Only publish images for a commit whose tests already passed. `test` is the
# workflow name, which Woodpecker derives from .woodpecker/test.yaml's filename.
depends_on:
  - test

# Tags in this repo are UNPREFIXED -- cog.toml sets `tag_prefix = ""`, so they
# look like `0.5.0`, not `v0.5.0`. A `refs/tags/v*` filter would match nothing
# and releases would silently never build.
when:
  - event: tag

matrix:
  BIN:
    # keep-sorted start
    - hamcp-server
    - lokimcp-server
    - pbsmcp-server
    - pgmcp-server
    - prommcp-server
    # keep-sorted end

steps:
  # Mirrors the guard in push_harbor.sh: refuse to publish if the git tag and
  # the workspace version disagree. Without this, a mistagged commit produces
  # images whose tag lies about the binary inside them -- and Harbor would
  # happily accept them.
  - name: verify-tag-matches-version
    image: docker.io/library/alpine:3
    commands:
      - |
        VERSION="$(awk '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^[[:space:]]*version[[:space:]]*=/ {
                gsub(/.*=[[:space:]]*"?/, ""); gsub(/".*/, ""); print; exit
            }
        ' Cargo.toml)"
        [ -n "$VERSION" ] || { echo "error: no version in [workspace.package]"; exit 1; }
        # Tolerate a leading v in case tag_prefix is ever changed.
        TAG_VERSION="$${CI_COMMIT_TAG#v}"
        echo "tag=$${CI_COMMIT_TAG} tag_version=$$TAG_VERSION cargo_version=$$VERSION"
        [ "$$TAG_VERSION" = "$$VERSION" ] || {
            echo "error: tag ($$TAG_VERSION) does not match Cargo version ($$VERSION)"
            exit 1
        }

  - name: publish
    # !! COUPLED TO SERVER CONFIG -- do not bump this tag alone !!
    # This exact string must also appear in the server's
    # `WOODPECKER_PLUGINS_PRIVILEGED` allowlist. Woodpecker matches the image
    # verbatim, so changing `:5` here without changing it there makes the step
    # fail at *runtime* with an "insufficient privileges" error that reads like
    # a YAML mistake. The two must move together, in the same change.
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [verify-tag-matches-version]
    # Requires the repo's `Security` trust level (Woodpecker's linter checks
    # `trusted.Security`, and rejects the whole pipeline -- including unrelated
    # workflows -- when it is off). `Network` and `Volumes` are NOT needed.
    privileged: true
    settings:
      registry: homelab-harbor.dropbear-butterfly.ts.net
      repo: homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${BIN}
      dockerfile: Containerfile
      # Containerfile cross-compiles to x86_64-unknown-linux-musl, so a second
      # platform here would silently produce an amd64 binary in an arm64 image.
      # Adding arm64 means parameterising TARGET, not just this list.
      platforms: linux/amd64
      build_args:
        BIN: ${BIN}
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      # Registry-backed layer cache. The `RUN --mount=type=cache` mounts inside
      # Containerfile are daemon-local and do NOT travel here, so this caches the
      # apt/rustup layers rather than the cargo build itself.
      cache_from: type=registry,ref=homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${BIN}:buildcache
      cache_to: type=registry,ref=homelab-harbor.dropbear-butterfly.ts.net/mcp-servers/${BIN}:buildcache,mode=max
      username:
        from_secret: HARBOR_USERNAME
      password:
        from_secret: HARBOR_PASSWORD
