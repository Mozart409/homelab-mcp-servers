# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/main/pipeline/frontend/yaml/linter/schema/schema.json
#
# Lint + test the workspace, then scan it with trivy.
#
# Why Nix rather than a `rust:1.x` image: the toolchain is pinned by
# `flake.lock` (fenix), with no version literal anywhere in the repo. Naming a
# rustc version in this file would create a second, hand-maintained pin that
# drifts the moment anyone runs `nix flake update` — and because clippy runs
# with `-D clippy::pedantic`, a CI toolchain even one minor ahead of the
# workstation fails on lints that do not exist locally. Running the flake's own
# `devShells.ci` makes that class of failure structurally impossible.
#
# The cost of that choice is closure realisation, which is what the Attic cache
# below is for. Reads are public, so this works unauthenticated — including on
# pull requests, where Woodpecker withholds secrets by default.

# Deliberately NOT triggered by `manual`. A manual run is how preflight.yaml gets
# invoked, and a manual trigger fires every matching workflow — so including it
# here meant the diagnostic competed with a full Rust compile for the agent.
# Preflight's later steps then expired in the queue with `queue: task expired`,
# i.e. the workflow you reach for when CI is broken was starved by the thing it
# was meant to diagnose. Push/PR/tag still cover every case that matters; use
# "Restart" on a previous pipeline to re-run tests by hand.
when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag

variables:
  # Pinned, not `:latest`. Woodpecker's `pull` defaults to false, so a floating
  # tag leaves the agent on whatever it first cached -- one run landed on an
  # image whose CA layout differed from the published one, which cost an entire
  # debugging cycle. Forcing `pull: true` instead made every step re-pull and
  # helped saturate the agent into `queue: task expired`, so pinning is the fix
  # that costs nothing per run.
  - &nix_image 'docker.io/nixos/nix:2.35.1'
  # Flakes are still gated behind experimental-features. `extra-substituters`
  # (not `substituters`) appends to the image's defaults so cache.nixos.org is
  # kept as a fallback when the homelab cache is unreachable.
  - &nix_env
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      extra-substituters = https://cache.homelab.local/homelab
      extra-trusted-public-keys = homelab:aswnRAo2zbP13gGnUTCINX78X/lURQgPAfrgNpHpQpY=
      accept-flake-config = true
      connect-timeout = 5
      stalled-download-timeout = 60
      # Step containers are capped at 3 cores by the agent's
      # WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA, on a 4-core VM shared with
      # the server. (An earlier revision of this comment said the VM had 2
      # cores; it has 4 -- the cap is the quota, not the hardware.) Left
      # unbounded, Nix ran one derivation with
      # `cargo -j 3` and oversubscribed the quota, and the Woodpecker agent
      # could not service its task lease — the server then killed the step with
      # `queue: task expired` after six minutes of real work. Bounding this keeps
      # a scheduler slot free for the agent's own bookkeeping. Raise both if the
      # agent ever gets more cores.
      # Measured: peak CPU on the agent host hit 98.9% during these builds
      # (node_cpu_seconds_total, 2h window). `cores = 2` on a 2-core box still
      # saturates it, so this leaves one core for the agent's own bookkeeping.
      # Builds are slower; a build that finishes beats a faster one the server
      # kills. Raise to 2 if the agent VM ever gets more cores.
      max-jobs = 1
      cores = 1
      # `max-jobs`/`cores` bound DERIVATION BUILDS ONLY. They do nothing for
      # substitution -- the `copying path ... from cache.homelab.local` phase --
      # which is bounded by `http-connections` (default 25). That gap is what
      # killed pipeline #25: the step was still healthily copying vendored crate
      # sources when the agent stopped being able to renew its workflow lease.
      #
      # The server and the agent share one VM, and memory is the binding
      # constraint there, not cores: the guest balloons down toward its
      # `floating` minimum, and on the day of #25 MemTotal had drifted from
      # ~3.0 GB to ~1.2 GB with only ~240 MB available. Up to 25 concurrent NAR
      # fetches, each decompressing on arrival, is a page-cache and CPU spike
      # that box cannot absorb -- woodpecker-server's SQLite began returning
      # `database is locked`, the agent's `extend()` RPC failed with `sql: no
      # rows in result set`, and five minutes later the server expired the task
      # and orphaned the container. The UI reports that as `Canceled` with no
      # error in the step log, which points at the build and is the wrong place
      # to look -- check the agent/server journal instead.
      #
      # 4 keeps the cache worth having -- the ~800 paths still stream four at a
      # time, nowhere near the bottleneck here -- while leaving the server
      # enough memory and CPU to service its own writes. This bounds the blast
      # radius; it does not fix the cause, which is a ballooned-down VM running
      # a SQLite-backed server alongside its own agent.
      http-connections = 4

  # Trust the homelab step-ca root inside the container.
  #
  # The workstation trusts it via NixOS `security.pki.certificates`; a container
  # gets a stock bundle and therefore does not. Without this the Attic cache
  # fails TLS verification (`unable to get local issuer certificate`) even though
  # the same URL returns 200 from a shell on the host — Nix then falls back to
  # cache.nixos.org and every run pays full price for a cache that looks
  # configured but is never used.
  #
  # The certificate is committed at .woodpecker/homelab-ca.crt. A ROOT CA
  # CERTIFICATE IS PUBLIC — it is handed to every client that talks to a
  # step-ca-issued endpoint; the secret half is the CA private key, which lives
  # only in step-ca.
  #
  # SCOPE: this is needed ONLY for step-ca-issued names like *.homelab.local.
  # Services on the tailnet (*.dropbear-butterfly.ts.net) carry publicly trusted
  # certs from Tailscale, which any stock CA bundle already verifies -- which is
  # why the deployed MCP servers reach Home Assistant, PBS, and Prometheus from
  # containers without any of this. The Attic cache is the odd one out.
  # Committing it is what lets this work with no volume mounts, no `Volumes`
  # trust level, and no custom agent image.
  #
  # Appending to the image's own bundle (rather than replacing it) keeps
  # cache.nixos.org and github.com working.
  - &ca_setup |
    set -e
    bundle=/tmp/homelab-ca-bundle.crt

    # Locate the system CA bundle. `-s` (exists AND non-empty) rather than `-r`,
    # because /etc/ssl/certs/* are symlinks into the nix profile and a dangling
    # symlink would otherwise look usable.
    base=""
    for c in "$NIX_SSL_CERT_FILE" "$SSL_CERT_FILE" \
             /etc/ssl/certs/ca-certificates.crt \
             /etc/ssl/certs/ca-bundle.crt \
             /etc/pki/tls/certs/ca-bundle.crt \
             /nix/var/nix/profiles/default/etc/ssl/certs/ca-bundle.crt \
             /root/.nix-profile/etc/ssl/certs/ca-bundle.crt; do
      if [ -n "$c" ] && [ -s "$c" ]; then base="$c"; break; fi
    done

    if [ -z "$base" ]; then
      # FAIL SAFE. An earlier version fell through to writing a bundle holding
      # ONLY the homelab root, which silently REPLACED the trust store instead
      # of extending it -- so cache.nixos.org and github.com lost their trust
      # anchor and every fetch failed. Losing the homelab cache costs time;
      # losing public TLS breaks the build outright, so leave it alone.
      echo "WARNING: no system CA bundle found -- NOT overriding the trust store."
      echo "         The homelab cache will fail TLS and Nix will fall back to"
      echo "         public substituters (slower, but working)."
    else
      cat "$base" .woodpecker/homelab-ca.crt > "$bundle"
      export NIX_SSL_CERT_FILE="$bundle"
      export CURL_CA_BUNDLE="$bundle"
      export SSL_CERT_FILE="$bundle"
      echo "trust store: $bundle (base: $base, +1 homelab root)"
    fi

    # Self-check: prove the resulting trust store works for BOTH a public host
    # and the homelab one. Without this the misconfiguration above surfaced four
    # minutes later as an unrelated-looking fetch error.
    for u in https://cache.nixos.org/nix-cache-info \
             https://cache.homelab.local/homelab/nix-cache-info; do
      if curl -fsS --max-time 10 -o /dev/null "$u" 2>/dev/null; then
        echo "  trust OK   $u"
      else
        echo "  trust FAIL $u"
      fi
    done

steps:
  # fmt + clippy + tests, run through crane so the compiled dependency tree is a
  # Nix store path.
  #
  # This used to be `just ci`, which shells out to cargo directly — and cargo's
  # `target/` and `~/.cargo` live in a container that is destroyed when the step
  # ends. Nothing outside the Nix store can be served by Attic, so every run
  # recompiled all ~1580 dependency crates from scratch. Going through
  # `checks.*` shares `cargoArtifacts` with the package builds, so dependencies
  # are compiled once, cached, and substituted thereafter — leaving only the ~11
  # workspace crates.
  #
  # `just ci` remains the local entry point and runs the same lints with the same
  # toolchain; only the execution path differs.
  - name: ci
    image: *nix_image
    environment: *nix_env
    commands:
      - *ca_setup
      # Nix refuses to evaluate a flake in a repo it considers foreign-owned,
      # and the clone step's uid does not match the step container's.
      - 'git config --global --add safe.directory "$CI_WORKSPACE"'
      # Fail fast and legibly when the network is the problem. Realising the CI
      # shell is the first thing that touches substituters, so if egress is
      # broken this is where it shows -- and without a bounded, separate step it
      # shows as "the whole ci step hung", which says nothing about the cause.
      # --profile also materialises the closure as a GC root, which the
      # cache-push step below needs in order to have something to upload.
      - 'timeout 900 nix develop --profile ./.ci-profile .#ci --command true || { echo "FAIL - could not realise devShells.ci. Run the preflight workflow: this is almost always DNS or egress from the agent, not a problem with the code."; exit 1; }'
      # The system is spelled out rather than derived: this agent is amd64, and
      # release.yaml pins linux/amd64 for the same reason.
      - 'nix build --no-link --print-build-logs .#checks.x86_64-linux.fmt .#checks.x86_64-linux.clippy .#checks.x86_64-linux.test'
      # cargo-deny fetches the RustSec advisory database over the network, and
      # Nix builds run sandboxed without network access — so it cannot be a
      # crane check by construction. Run it in the dev shell, which is already
      # realised and cached by this point, so it costs seconds.
      - 'nix develop --profile ./.ci-profile .#ci --command cargo deny check'

  # Populate the cache so the next run skips closure realisation. Gated to
  # trusted events: Woodpecker does not expose secrets to `pull_request` by
  # default, and this must stay that way — a fork PR could otherwise exfiltrate
  # the write token. Reads stay public, so PRs still get full cache benefit.
  - name: cache-push
    image: *nix_image
    depends_on: [ci]
    environment:
      <<: *nix_env
      ATTIC_PUSH_TOKEN:
        from_secret: ATTIC_PUSH_TOKEN
    commands:
      - *ca_setup
      # Trailing slash is deliberate. Attic joins the API endpoint with the cache
      # name; without it the binary-cache URL can render as
      # `https://cache.homelab.localhomelab`. The slash is correct whether attic
      # joins properly or concatenates naively, so it costs nothing to be safe.
      - nix run nixpkgs#attic-client -- login homelab https://cache.homelab.local/ "$ATTIC_PUSH_TOKEN"
      # Push BOTH the dev shell and the compiled dependency tree.
      #
      # `./.ci-profile` alone is not enough: it holds the toolchain, but
      # `cargoArtifacts` — the ~1580 compiled dependency crates that the crane
      # checks consume — is a build input rather than part of any output's
      # runtime closure, so it would never be uploaded. Pushing only the profile
      # would mean the crane checks recompile every dependency on every run,
      # which is the exact cost they exist to remove.
      - 'nix run nixpkgs#attic-client -- push homelab:homelab ./.ci-profile $(nix build --no-link --print-out-paths .#legacyPackages.x86_64-linux.cargo-artifacts)'
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: tag
    # A cache push failing must not fail a pipeline whose code is already green.
    failure: ignore

  # Vulnerability / secret / misconfiguration scan.
  #
  # WHY `fs` AND NOT `image`: `just scan` builds an OCI image and runs
  # `trivy image` against it. The homelab does not deploy those images, so
  # building one purely to scan it would mean reintroducing everything the
  # deleted release.yaml needed -- a privileged buildx step, the repo's
  # `Security` trust level, and a server-side `WOODPECKER_PLUGINS_PRIVILEGED`
  # entry. `trivy fs` reads Cargo.lock and the tree directly, so this is an
  # ordinary unprivileged step.
  #
  # WHAT THIS ACTUALLY ADDS: the `vuln` scanner resolves Cargo.lock against
  # RustSec-derived advisories, which is very nearly what `cargo deny check
  # advisories` already does in the ci step above -- treat it as a second
  # opinion, not as the reason this step exists. The new coverage is `secret`
  # (a credential committed by accident) and `misconfig` (Containerfile,
  # compose.yaml), neither of which cargo-deny looks at.
  #
  # NETWORK: trivy downloads its vulnerability DB (and, for `misconfig`, its
  # checks bundle) on every run -- the image ships without either, and the step
  # container is destroyed afterwards so there is nothing to cache. As of trivy
  # 0.73 those come from `mirror.gcr.io/aquasec/*` first, falling back to
  # `ghcr.io/aquasecurity/*`. That is an egress target beyond the substituters,
  # which is why preflight.yaml probes both hosts; a DB download failure
  # otherwise surfaces as an opaque trivy error that says nothing about DNS.
  - name: trivy
    # Pinned, matching the workstation's trivy (see devShells.default in
    # flake.nix) so `just scan` and CI report the same findings. Same rationale
    # as the pinned nix image above: Woodpecker's `pull` defaults to false, so a
    # floating tag leaves the agent on whatever it first cached.
    image: docker.io/aquasec/trivy:0.73.0
    # Sequential rather than parallel with cache-push. The agent VM has 2 cores
    # and has previously killed steps with `queue: task expired` when several
    # containers started at once; scanning a tree whose tests just failed is
    # worth nothing anyway.
    depends_on: [ci]
    commands:
      # --skip-dirs: `.ci-profile` is the GC root the ci step materialises and
      # points into /nix/store; `target` and `.direnv` only exist on a developer
      # checkout. None of them are this repo's code, and walking them is slow.
      - |
        trivy fs . \
          --scanners vuln,secret,misconfig \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --skip-dirs .ci-profile \
          --skip-dirs target \
          --skip-dirs .direnv \
          --skip-version-check \
          --no-progress \
          --timeout 10m
    # Advisory, not a gate. A new CVE lands in a transitive crate without anyone
    # touching this repo, and that must not red-line a pipeline whose code is
    # green -- `failure: ignore` still marks the step failed in the UI, so the
    # finding is visible without blocking a merge. Drop this line to make the
    # scan blocking.
    failure: ignore
