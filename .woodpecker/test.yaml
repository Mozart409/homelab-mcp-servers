# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/main/pipeline/frontend/yaml/linter/schema/schema.json
#
# Lint + test the workspace.
#
# Why Nix rather than a `rust:1.x` image: the toolchain is pinned by
# `flake.lock` (fenix), with no version literal anywhere in the repo. Naming a
# rustc version in this file would create a second, hand-maintained pin that
# drifts the moment anyone runs `nix flake update` — and because clippy runs
# with `-D clippy::pedantic`, a CI toolchain even one minor ahead of the
# workstation fails on lints that do not exist locally. Running the flake's own
# `devShells.ci` makes that class of failure structurally impossible.
#
# The cost of that choice is closure realisation, which is what the Attic cache
# below is for. Reads are public, so this works unauthenticated — including on
# pull requests, where Woodpecker withholds secrets by default.

when:
  - event: [pull_request, manual]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag

variables:
  # `latest` is not reproducible; pin this to a released tag once you have
  # confirmed which one your agent has cached.
  - &nix_image 'nixos/nix:latest'
  # Flakes are still gated behind experimental-features. `extra-substituters`
  # (not `substituters`) appends to the image's defaults so cache.nixos.org is
  # kept as a fallback when the homelab cache is unreachable.
  - &nix_env
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      extra-substituters = https://cache.homelab.local/homelab
      extra-trusted-public-keys = homelab:aswnRAo2zbP13gGnUTCINX78X/lURQgPAfrgNpHpQpY=
      accept-flake-config = true
      connect-timeout = 5
      stalled-download-timeout = 60

  # Trust the homelab step-ca root inside the container.
  #
  # The workstation trusts it via NixOS `security.pki.certificates`; a container
  # gets a stock bundle and therefore does not. Without this the Attic cache
  # fails TLS verification (`unable to get local issuer certificate`) even though
  # the same URL returns 200 from a shell on the host — Nix then falls back to
  # cache.nixos.org and every run pays full price for a cache that looks
  # configured but is never used.
  #
  # The certificate is committed at .woodpecker/homelab-ca.crt. A ROOT CA
  # CERTIFICATE IS PUBLIC — it is handed to every client that talks to the
  # homelab; the secret half is the CA private key, which lives only in step-ca.
  # Committing it is what lets this work with no volume mounts, no `Volumes`
  # trust level, and no custom agent image.
  #
  # Appending to the image's own bundle (rather than replacing it) keeps
  # cache.nixos.org and github.com working.
  - &ca_setup |
    set -e
    base=""
    for c in /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-bundle.crt "$NIX_SSL_CERT_FILE"; do
      if [ -n "$c" ] && [ -r "$c" ]; then base="$c"; break; fi
    done
    bundle=/tmp/homelab-ca-bundle.crt
    { if [ -n "$base" ]; then cat "$base"; fi; cat .woodpecker/homelab-ca.crt; } > "$bundle"
    export NIX_SSL_CERT_FILE="$bundle"
    export CURL_CA_BUNDLE="$bundle"
    export SSL_CERT_FILE="$bundle"
    echo "trust store: $bundle (base: ${base:-none}, +1 homelab root)"

steps:
  # `just ci` is `lint-ci test` — fmt-check, clippy, cargo-deny, cargo test.
  # It is deliberately the read-only variant: plain `just lint` runs `cargo fmt`,
  # which rewrites files and would let unformatted code pass a pipeline.
  - name: ci
    image: *nix_image
    environment: *nix_env
    commands:
      - *ca_setup
      # Nix refuses to evaluate a flake in a repo it considers foreign-owned,
      # and the clone step's uid does not match the step container's.
      - 'git config --global --add safe.directory "$CI_WORKSPACE"'
      # Fail fast and legibly when the network is the problem. Realising the CI
      # shell is the first thing that touches substituters, so if egress is
      # broken this is where it shows -- and without a bounded, separate step it
      # shows as "the whole ci step hung", which says nothing about the cause.
      # 15 min is generous for a cold closure and still far short of the
      # pipeline timeout.
      - 'timeout 900 nix develop --profile ./.ci-profile .#ci --command true || { echo "FAIL - could not realise devShells.ci. Run the preflight workflow: this is almost always DNS or egress from the agent, not a problem with the code."; exit 1; }'
      # Only now run the actual gate, against a closure already on disk.
      # --profile materialises it as a GC root so the push step below has
      # something concrete to upload; without it the closure is reachable only
      # through the eval cache and `attic push` has no path to send.
      - 'nix develop --profile ./.ci-profile .#ci --command just ci'

  # Populate the cache so the next run skips closure realisation. Gated to
  # trusted events: Woodpecker does not expose secrets to `pull_request` by
  # default, and this must stay that way — a fork PR could otherwise exfiltrate
  # the write token. Reads stay public, so PRs still get full cache benefit.
  - name: cache-push
    image: *nix_image
    depends_on: [ci]
    environment:
      <<: *nix_env
      ATTIC_PUSH_TOKEN:
        from_secret: ATTIC_PUSH_TOKEN
    commands:
      - *ca_setup
      # Trailing slash is deliberate. Attic joins the API endpoint with the cache
      # name; without it the binary-cache URL can render as
      # `https://cache.homelab.localhomelab`. The slash is correct whether attic
      # joins properly or concatenates naively, so it costs nothing to be safe.
      - nix run nixpkgs#attic-client -- login homelab https://cache.homelab.local/ "$ATTIC_PUSH_TOKEN"
      - nix run nixpkgs#attic-client -- push homelab:homelab ./.ci-profile
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: tag
    # A cache push failing must not fail a pipeline whose code is already green.
    failure: ignore
