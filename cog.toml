# cocogitto configuration — https://docs.cocogitto.io/reference/config
#
# Release flow:
#   cog bump --auto      # pick the bump from conventional commits
#   cog bump --minor     # or force a level
#   ./push_harbor.sh     # build + push the tagged images to the internal Harbor
#
# The bump publishes itself: the post-bump hook below pushes the commit and the
# tag to every remote, and the tag landing on GitHub starts
# .github/workflows/release.yml, which builds one image per server and pushes it
# to GHCR. push_harbor.sh remains a manual step because Harbor lives on the
# tailnet and no hosted runner can reach it.
#
# cog bumps the [workspace.package] version in Cargo.toml, refreshes
# Cargo.lock, updates CHANGELOG.md, then creates the version commit + tag.
# flake.nix reads the version from Cargo.toml at eval time, so it stays
# in sync automatically — no hook needed.

# Only cut releases from main.
branch_whitelist = ["main"]

# Conventional-commit hygiene.
ignore_merge_commits = true

# Tags are bare semver (0.1.0, 0.2.1 …) — no "v" prefix. Keep it that way so
# existing tags and push_harbor.sh stay consistent.
tag_prefix = ""

# cog itself does NOT edit Cargo.toml, so we do it here before the version
# commit is created (cog stages and includes these changes in the bump commit):
#   1. cargo set-version (cargo-edit) rewrites the [workspace.package] version
#      and updates Cargo.lock,
#   2. cargo check aborts the bump if the workspace no longer compiles.
# {{version}} is templated by cog.
pre_bump_hooks = [
    "cargo set-version --workspace {{version}}",
    "cargo check --workspace",
]

# Publish the bump commit and the new tag to EVERY remote, not just origin.
#
# `just push-all` enumerates `git remote` rather than naming them, so this works
# unchanged on a clone that has only origin and on one that also carries the
# GitHub mirror. Two things depend on it going everywhere:
#
#   * the tag reaching GitHub is what triggers .github/workflows/release.yml,
#     which builds and pushes the container images to GHCR — a release that
#     stopped at origin would leave the images unbuilt until someone remembered
#     to sync by hand,
#   * `git describe --exact-match` on any clone (push_harbor.sh's guard) needs
#     the tag to actually be there.
post_bump_hooks = [
    "just push-all",
]

[changelog]
path = "CHANGELOG.md"
