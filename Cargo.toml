[workspace]
members = ["crates/*/*"]
exclude = [".direnv"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
publish = false

[workspace.dependencies]
# keep-sorted start
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "2.2", features = ["transport-streamable-http-server", "schemars"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "tls-rustls-ring-webpki"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "2"
url = "2.5"
utoipa = "5"
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
# keep-sorted end
