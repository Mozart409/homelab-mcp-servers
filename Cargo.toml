[workspace]
members = ["crates/*/*"]
exclude = [".direnv"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
publish = false

[workspace.dependencies]
# keep-sorted start
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
dotenvy = "0.15"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rmcp = { version = "3.1", features = ["transport-streamable-http-server", "schemars"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "tls-rustls-ring-webpki"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
url = "2.5"
utoipa = "5"
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
wiremock = "0.6"
# keep-sorted end

# Panic-prone shortcuts are denied workspace-wide: these servers are long-running
# daemons, so a panic takes down every in-flight MCP request, not just the one
# that hit the bad path. Propagate errors with `color_eyre::eyre::Result` in
# lib/`run()` code, or map into `rmcp::ErrorData` inside `#[tool]` methods.
# Tests are exempt via `clippy.toml` (`allow-unwrap-in-tests` etc.).
[workspace.lints.clippy]
# keep-sorted start
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
# keep-sorted end

# Build-time tuning. These numbers come from measuring this workspace on a
# 6-core box; see `docs/build-performance.md` for the method and the before/after.
#
# WHY dev DEBUGINFO IS TRIMMED: `cargo test --workspace --no-run` after a
# one-line edit cost 61s, while `cargo check` on the same edit cost 3s. The gap
# is not type-checking, it is codegen and linking — and the bulk of what the
# linker was moving around was DWARF for ~300 dependencies nobody ever steps
# into. `line-tables-only` keeps file/line in every backtrace (which is what
# these servers' `color_eyre` reports actually use) and drops the variable-level
# DWARF that a debugger would want. Dependencies drop debuginfo entirely.
#
# Measured A/B in fresh target dirs: that 61s edit-to-test-binaries loop became
# 5s, a cold build of the same went 351s -> 177s, and the target dir shrank from
# 7.0G to 3.0G.
#
# If you need to single-step through a dependency, override for that session:
#   CARGO_PROFILE_DEV_PACKAGE_hyper_DEBUG=true cargo build
[profile.dev]
debug = "line-tables-only"

# `"*"` matches dependencies only, never workspace members — so this is the
# 300-crate half of the tree, not your own code.
[profile.dev.package."*"]
debug = false
