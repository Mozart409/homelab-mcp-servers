[workspace]
members = ["crates/*/*"]
exclude = [".direnv"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
publish = false

[workspace.dependencies]
# keep-sorted start
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
dotenvy = "0.15"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.1", features = ["transport-streamable-http-server", "schemars"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "tls-rustls-ring-webpki"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
url = "2.5"
utoipa = "5"
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
wiremock = "0.6"
# keep-sorted end

# Panic-prone shortcuts are denied workspace-wide: these servers are long-running
# daemons, so a panic takes down every in-flight MCP request, not just the one
# that hit the bad path. Propagate errors with `color_eyre::eyre::Result` in
# lib/`run()` code, or map into `rmcp::ErrorData` inside `#[tool]` methods.
# Tests are exempt via `clippy.toml` (`allow-unwrap-in-tests` etc.).
[workspace.lints.clippy]
# keep-sorted start
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
# keep-sorted end
